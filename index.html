<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR Hardware Comparison</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1f1f1f;
            color: white;
            margin: 0;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #333;
            height: 100vh;
            padding-top: 20px;
            position: fixed;
        }

        .sidebar a {
            padding: 15px;
            text-decoration: none;
            color: white;
            display: block;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        /* Main Content */
        .content {
            margin-left: 250px;
            padding: 20px;
            width: calc(100% - 250px);
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #FF5733;
        }

        /* Cards for Comparison */
        .comparison-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background-color: #333;
            width: 300px;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .card-title {
            font-size: 1.5rem;
            margin-top: 10px;
            color: #FF5733;
        }

        .price {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        .price span {
            color: #FFD700;
        }

        .button {
            background-color: #FF5733;
            border: none;
            padding: 10px;
            color: white;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }

        .button:hover {
            background-color: #c7481f;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .content {
                margin-left: 0;
                width: 100%;
            }

            .comparison-cards {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#" id="price-range">Price Range</a>
        <a href="#" id="keyboard-comparison">Keyboard Comparison</a>
        <a href="#" id="power-supply">Power Supply Comparison</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1>Hardware Product Comparison</h1>

        <!-- Comparison Cards Section -->
        <div class="comparison-cards" id="comparison-cards">
            <!-- Cards will be dynamically inserted based on selection -->
        </div>
    </div>

    <script>
        // Sample Data for Comparisons
        const data = {
            "keyboard": [
                {
                    name: "Mechanical Keyboard A",
                    image: "https://via.placeholder.com/300x200?text=Keyboard+A",
                    price: "$99.99"
                },
                {
                    name: "Mechanical Keyboard B",
                    image: "https://via.placeholder.com/300x200?text=Keyboard+B",
                    price: "$129.99"
                }
            ],
            "powerSupply": [
                {
                    name: "Power Supply A",
                    image: "https://via.placeholder.com/300x200?text=Power+Supply+A",
                    price: "$59.99"
                },
                {
                    name: "Power Supply B",
                    image: "https://via.placeholder.com/300x200?text=Power+Supply+B",
                    price: "$79.99"
                }
            ],
            "priceRange": [
                {
                    name: "Budget Keyboard",
                    image: "https://via.placeholder.com/300x200?text=Budget+Keyboard",
                    price: "$29.99"
                },
                {
                    name: "Premium Keyboard",
                    image: "https://via.placeholder.com/300x200?text=Premium+Keyboard",
                    price: "$199.99"
                }
            ]
        };

        // Function to Render Comparison Cards
        function renderCards(category) {
            const cardsContainer = document.getElementById('comparison-cards');
            cardsContainer.innerHTML = ''; // Clear existing content
            const categoryData = data[category];

            categoryData.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="card-title">${item.name}</div>
                    <div class="price">Price: <span>${item.price}</span></div>
                    <button class="button">Compare</button>
                `;
                cardsContainer.appendChild(card);
            });
        }

        // Event Listeners for Sidebar Links
        document.getElementById('price-range').addEventListener('click', () => {
            renderCards('priceRange');
        });

        document.getElementById('keyboard-comparison').addEventListener('click', () => {
            renderCards('keyboard');
        });

        document.getElementById('power-supply').addEventListener('click', () => {
            renderCards('powerSupply');
        });

        // Initial render (e.g., load Price Range category by default)
        renderCards('priceRange');
    </script>
</body>
</html>
